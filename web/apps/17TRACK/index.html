<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track Your Order | TrendyCatch</title><meta name="description" content="Track your TrendyCatch order with your tracking number.">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e7;color:#1a1a1a;font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#1b5e20;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}header a{color:#fff;text-decoration:none;font-size:14px;font-weight:600}.brand{font-size:19px;font-weight:800}.brand span{color:#ffb703}main{max-width:760px;margin:0 auto;padding:42px 18px}h1{font-size:clamp(25px,6vw,34px);margin:0 0 12px}p{color:#59616b;line-height:1.6}section{background:white;border:1px solid #e7e7e7;border-radius:16px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.05)}label{display:block;font-size:14px;font-weight:700;margin:22px 0 8px}.row{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #aeb7b1;border-radius:8px;padding:13px;font-size:16px}button{border:0;border-radius:8px;background:#1b5e20;color:#fff;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer}button:hover{background:#0f3d14}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffb703;outline-offset:2px}.help{font-size:13px;margin:12px 0 0}.help a{color:#1b5e20}#YQContainer{margin-top:20px}.error{color:#a01b1b;font-size:14px}.fallback{font-size:14px} @media(max-width:520px){main{padding:28px 14px}section{padding:20px}.row{flex-direction:column}button{width:100%;min-height:48px}input{min-height:48px}}
</style></head><body><header><a class="brand" href="/">Trendy<span>Catch</span></a><a href="/">Continue shopping</a></header><main><section><h1>Track your order</h1><p>Enter the tracking number from your shipping confirmation to see the latest updates.</p><form id="trackingForm"><label for="trackingNumber">Tracking number</label><div class="row"><input id="trackingNumber" name="trackingNumber" type="text" autocomplete="off" required maxlength="100" placeholder="Enter your tracking number"><button type="submit">Track order</button></div></form><p class="help">Need help? Email <a href="mailto:orders@trendycatch.us">orders@trendycatch.us</a>.</p><p id="error" class="error" role="status"></p><div id="YQContainer" aria-live="polite"></div></section></main>
