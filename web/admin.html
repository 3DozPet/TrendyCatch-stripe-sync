<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrendyCatch — Live Orders</title>
<style>
  :root { --ink:#121417; --muted:#6b7280; --bg:#0f1115; --card:#1a1d24; --border:#2a2e37; --accent:#34d399; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#f3f4f6; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--border); }
  header h1 { font-size:18px; margin:0; font-weight:700; }
  header .status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:12px; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; font-size:14px; }
  .order {
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px;
    display:flex; justify-content:space-between; gap:16px; align-items:flex-start;
    animation: slidein 0.35s ease;
  }
  @keyframes slidein { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform:none; } }
  .order.new { box-shadow: 0 0 0 2px var(--accent); }
  .order .left { display:flex; flex-direction:column; gap:4px; }
  .order .top-line { font-weight:700; font-size:15px; }
  .order .items { font-size:13px; color:#cbd5e1; }
  .order .meta { font-size:12px; color:var(--muted); }
  .badge {
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
    background:rgba(52,211,153,0.15); color:var(--accent); border:1px solid rgba(52,211,153,0.3);
  }
  .badge.facebook, .badge.instagram, .badge.meta { background:rgba(59,130,246,0.15); color:#60a5fa; border-color:rgba(59,130,246,0.3); }
  .badge.tiktok { background:rgba(244,114,182,0.15); color:#f472b6; border-color:rgba(244,114,182,0.3); }
  .badge.google, .badge.youtube { background:rgba(251,191,36,0.15); color:#fbbf24; border-color:rgba(251,191,36,0.3); }
  .badge.direct, .badge.organic_search, .badge.referral { background:rgba(148,163,184,0.15); color:#94a3b8; border-color:rgba(148,163,184,0.3); }
  .right { text-align:right; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .amount { font-size:18px; font-weight:800; }
  .enable-sound {
    position:fixed; bottom:20px; right:20px; background:var(--accent); color:#06281f; border:none;
    padding:12px 18px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer;
  }
  /* ---- Home-screen summary: revenue / orders / live visitors, by country & platform ---- */
  .summary { max-width:900px; margin:0 auto; padding:20px 24px 0; display:flex; flex-direction:column; gap:14px; }
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .stat-card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .stat-card .value { font-size:22px; font-weight:800; margin-top:4px; }
  .stat-card.live .value { color:var(--accent); }
  .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .breakdown-row { display:flex; gap:12px; flex-wrap:wrap; }
  .breakdown { flex:1; min-width:220px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .breakdown h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin:0 0 10px; }
  .breakdown-item { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .breakdown-item .tag { color:#cbd5e1; }
  .breakdown-item .num { font-weight:700; }
  .subscribers-panel { max-width:none; }
  .subscribers-panel .sub-row {
    display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0;
    border-bottom:1px solid var(--border);
  }
  .subscribers-panel .sub-row:last-child { border-bottom:none; }
  .subscribers-panel .sub-email { color:#f3f4f6; }
  .subscribers-panel .sub-meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  .header-btn {
    margin-left:10px; background:transparent; border:1px solid var(--border); color:#cbd5e1;
    font-size:11px; padding:5px 10px; border-radius:7px; cursor:pointer;
  }
  .header-btn:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>

<header>
  <h1>TrendyCatch — Live Orders</h1>
  <div class="status">
    <span class="dot"></span><span id="statusText">Listening…</span>
    <button id="changePwBtn" class="header-btn">Change password</button>
    <button id="logoutBtn" class="header-btn">Log out</button>
  </div>
</header>

<section class="summary">
  <div class="stat-row">
    <div class="stat-card">
      <div class="label">Total revenue</div>
      <div class="value" id="statRevenue">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Orders</div>
      <div class="value" id="statOrders">—</div>
    </div>
    <div class="stat-card live">
      <div class="label"><span class="live-dot"></span>Live on site</div>
      <div class="value" id="statLive">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Email signups</div>
      <div class="value" id="statSubscribers">—</div>
    </div>
  </div>
  <div class="breakdown-row">
    <div class="breakdown">
      <h3>Revenue by country</h3>
      <div id="byCountry"></div>
    </div>
    <div class="breakdown">
      <h3>Orders by ad platform</h3>
      <div id="bySource"></div>
    </div>
    <div class="breakdown">
      <h3>Live visitors by country</h3>
      <div id="liveByCountry"></div>
    </div>
  </div>
  <div class="breakdown subscribers-panel">
    <h3>Recent email signups — admin only, never shown to customers</h3>
    <div id="subscriberList"></div>
  </div>
</section>

<main id="orderList">
  <div class="empty" id="emptyState">Waiting for the first order to come in…</div>
</main>

<button class="enable-sound" id="soundBtn">🔇 Enable order sound</button>

<script>
let soundEnabled = false;
let since = Date.now() - 1000 * 60 * 60 * 6; // show orders from the last 6h on first load
let audioCtx = null;

document.getElementById("soundBtn").addEventListener("click", async () => {
  if (soundEnabled) {
    soundEnabled = false;
    document.getElementById("soundBtn").textContent = "🔇 Enable order sound";
    return;
  }
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    if (audioCtx.state !== "running") throw new Error("Audio is unavailable");
    soundEnabled = true;
    document.getElementById("soundBtn").textContent = "🔊 Sound on";
    playChime();
  } catch (error) {
    soundEnabled = false;
    document.getElementById("soundBtn").textContent = "🔇 Enable order sound";
    document.getElementById("statusText").textContent = "Sound unavailable — check browser audio";
  }
});

// A continuous metallic bicycle-bell ring, lasting half a second.
function playChime() {
  if (!audioCtx || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;
  const duration = 0.5;
  const tremolo = audioCtx.createGain();
  tremolo.gain.setValueAtTime(0.65, now);
  tremolo.connect(audioCtx.destination);

  const lfo = audioCtx.createOscillator();
  const depth = audioCtx.createGain();
  lfo.type = "sine";
  lfo.frequency.setValueAtTime(25, now);
  lfo.frequency.exponentialRampToValueAtTime(15, now + duration);
  depth.gain.value = 0.35;
  lfo.connect(depth);
  depth.connect(tremolo.gain);
  lfo.start(now);
  lfo.stop(now + duration);

  // Three overlapping bells, each with metallic overtones, ring together.
  [2637, 2793, 3136].flatMap((base) =>
    [[base, 0.05], [base * 2.76, 0.02], [base * 4.1, 0.01]]
  ).forEach(([frequency, level]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(level, now + 0.005);
      gain.gain.setValueAtTime(level, now + duration - 0.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(tremolo);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    });
}

function sourceClass(code) {
  return (code || "direct").toLowerCase().replace(/[^a-z_]/g, "");
}

function sourceLabel(order) {
  return order.sourceLabel || order.source || "Direct";
}

function renderOrder(order, isNew) {
  const el = document.createElement("div");
  el.className = "order" + (isNew ? " new" : "");
  const itemsText = (order.items || []).map((i) => `${i.quantity}× ${i.title}`).join(", ");
  el.innerHTML = `
    <div class="left">
      <div class="top-line">${order.orderName} — ${order.customerName}</div>
      <div class="items">${itemsText}</div>
      <div class="meta">${order.email || ""} ${order.phone ? "· " + order.phone : ""} ${order.country ? "· " + order.country : ""}</div>
    </div>
    <div class="right">
      <div class="amount">${order.currency || ""} ${Number(order.total || 0).toFixed(2)}</div>
      <span class="badge ${sourceClass(order.source)}">${sourceLabel(order)}</span>
    </div>
  `;
  return el;
}

function reloadIfUnauthorized(status) {
  if (status === 401) { location.reload(); return true; }
  return false;
}

async function poll() {
  try {
    const res = await fetch(`/admin-orders?since=${since}`);
    if (reloadIfUnauthorized(res.status)) return;
    const data = await res.json();
    document.getElementById("statusText").textContent = "Listening…";

    if (data.orders && data.orders.length > 0) {
      document.getElementById("emptyState")?.remove();
      const list = document.getElementById("orderList");
      // orders arrive newest-first; insert each at the top, oldest of the batch first
      [...data.orders].reverse().forEach((order) => {
        list.prepend(renderOrder(order, true));
        if (soundEnabled) playChime();
      });
      since = Math.max(since, ...data.orders.map((o) => o.ts || 0));

      // drop the "new" highlight after a few seconds
      setTimeout(() => {
        list.querySelectorAll(".order.new").forEach((el) => el.classList.remove("new"));
      }, 4000);
    }
  } catch (e) {
    document.getElementById("statusText").textContent = "Reconnecting…";
  }
}

const COUNTRY_NAMES = { AU: "Australia", NZ: "New Zealand", US: "United States", CA: "Canada", GB: "United Kingdom", UNKNOWN: "Unknown" };
function countryName(code) { return COUNTRY_NAMES[code] || code; }

function renderBreakdown(containerId, entries, formatValue) {
  const el = document.getElementById(containerId);
  if (!entries.length) {
    el.innerHTML = `<div class="breakdown-item"><span class="tag">—</span></div>`;
    return;
  }
  el.innerHTML = entries
    .map(([key, val]) => `<div class="breakdown-item"><span class="tag">${countryName(key)}</span><span class="num">${formatValue(val)}</span></div>`)
    .join("");
}

async function pollStats() {
  try {
    const res = await fetch("/stats");
    if (reloadIfUnauthorized(res.status)) return;
    const stats = await res.json();
    document.getElementById("statRevenue").textContent = `$${Number(stats.totalRevenue || 0).toFixed(2)}`;
    document.getElementById("statOrders").textContent = stats.totalOrders || 0;

    const byCountry = Object.entries(stats.byCountry || {}).sort((a, b) => b[1].revenue - a[1].revenue);
    renderBreakdown("byCountry", byCountry, (v) => `$${v.revenue.toFixed(2)} (${v.orders})`);

    const bySource = Object.entries(stats.bySource || {}).sort((a, b) => b[1].orders - a[1].orders);
    renderBreakdown(
      "bySource",
      bySource.map(([key, val]) => [key.charAt(0).toUpperCase() + key.slice(1), val]),
      (v) => `${v.orders} · $${v.revenue.toFixed(2)}`,
    );
  } catch (e) {
    // keep showing the last known numbers rather than blanking the dashboard
  }
}

async function pollLiveVisitors() {
  try {
    const res = await fetch("/live-visitors");
    if (reloadIfUnauthorized(res.status)) return;
    const live = await res.json();
    document.getElementById("statLive").textContent = live.count ?? 0;
    const byCountry = Object.entries(live.byCountry || {}).sort((a, b) => b[1] - a[1]);
    renderBreakdown("liveByCountry", byCountry, (v) => v);
  } catch (e) {
    // transient — leave the last known count showing
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function timeAgo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.round(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.round(hours / 24)}d ago`;
}

async function pollSubscribers() {
  try {
    const res = await fetch("/admin-subscribers");
    if (reloadIfUnauthorized(res.status)) return;
    const data = await res.json();
    document.getElementById("statSubscribers").textContent = data.count ?? 0;

    const el = document.getElementById("subscriberList");
    const subs = data.subscribers || [];
    if (!subs.length) {
      el.innerHTML = `<div class="sub-row"><span class="sub-email">No signups yet</span></div>`;
      return;
    }
    el.innerHTML = subs
      .slice(0, 25)
      .map(
        (s) =>
          `<div class="sub-row"><span class="sub-email">${escapeHtml(s.email)}</span><span class="sub-meta">${escapeHtml(countryName(s.country || "UNKNOWN"))} · ${timeAgo(s.createdAt)}</span></div>`,
      )
      .join("");
  } catch (e) {
    // transient — leave the last known list showing
  }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await fetch("/admin-logout", { method: "POST" });
  location.reload();
});

document.getElementById("changePwBtn").addEventListener("click", async () => {
  const current = prompt("Current password:");
  if (current === null) return;
  const next = prompt("New password (min 8 characters):");
  if (next === null) return;
  try {
    const res = await fetch("/admin-change-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ currentPassword: current, newPassword: next }),
    });
    const data = await res.json();
    alert(res.ok ? "Password changed." : (data.error || "Failed to change password."));
  } catch (e) {
    alert("Network error — try again.");
  }
});

poll();
pollStats();
pollLiveVisitors();
pollSubscribers();
setInterval(poll, 5000);
setInterval(pollStats, 10000);
setInterval(pollLiveVisitors, 5000);
setInterval(pollSubscribers, 15000);
</script>

</body>
</html>
