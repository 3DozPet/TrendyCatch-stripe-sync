<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank you — TrendyCatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body { margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f7f3ff linear-gradient(180deg,#ffeaf4 0,#f1eaff 300px,#e6f1ff 640px,#f7f3ff 900px) no-repeat; color:#2b2230; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { max-width:460px; text-align:center; padding:40px 32px; background:#fff; border:1px solid #e8e0f5; border-radius:16px; }
  .tick { width:56px; height:56px; border-radius:50%; background:#f1eaff; color:#5a3ec8; display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:28px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:#6e6480; font-size:14px; line-height:1.5; margin:0 0 18px; }
  h1 { font-family:"Fraunces",Georgia,serif; }
  a.btn { display:inline-block; background:linear-gradient(90deg,#5a3ec8 0%,#b8479f 100%); color:#fff; text-decoration:none; padding:12px 20px; border-radius:999px; font-weight:700; font-size:14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Order confirmed</h1>
    <p>Thanks for your order! A confirmation has been sent to your email, and it's on its way to being packed and shipped.</p>
    <a class="btn" href="/">Keep browsing</a>
    <p style="margin-top:18px; font-size:12px;">Questions about your order? <a href="mailto:orders@trendycatch.us" style="color:#ff5a3c;">orders@trendycatch.us</a></p>
  </div>

  <script>
    // Best-effort client-side PageView for the ad platforms (the authoritative
    // server-side Purchase event is already fired from the Stripe webhook —
    // see stripe-order-sync.ts — so this is just the browser-side signal that

      try {
        const config = await fetch("/config").then((r) => r.json());
        if (config.metaPixelId) {
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;

          document,'script','https://connect.facebook.net/en_US/fbevents.js');

            ttq.page();

    })();
  </script>
</body>
</html>
